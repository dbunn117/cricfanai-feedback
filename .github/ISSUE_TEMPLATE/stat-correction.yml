name: Stat correction
description: A number, label or definition on cricfanai.com looks wrong.
title: "[Stat] "
labels: ["correction"]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://cricfanai.com/players/...
    validations:
      required: true
  - type: textarea
    id: shown
    attributes:
      label: What the page shows
      placeholder: e.g. "Virat Kohli — T20I runs 3,840"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and where that figure comes from
      description: A link to a scorecard or official record helps most. Note that CricfanAI covers full-member T20Is and the major leagues only, so career totals from elsewhere will often be higher — see cricfanai.com/about.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem does it look like?
      options:
        - A calculation is wrong
        - A label or definition is unclear
        - A match or player is missing
        - Something else
    validations:
      required: false
